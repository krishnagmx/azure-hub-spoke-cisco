name: Local checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: 1.9.8
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m compileall -q app scripts
      - run: |
          for script in scripts/*.sh cisco/wan-init.sh; do
            bash -n "$script"
          done
      - run: terraform fmt -check -recursive
  terraform:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [dev, prod]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: 1.9.8
      - run: terraform -chdir=environments/${{ matrix.target }} init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=environments/${{ matrix.target }} validate -no-color
      - run: terraform -chdir=environments/${{ matrix.target }} test -var-file=config.tfvars -no-color
      - uses: terraform-linters/setup-tflint@v4.1.1
        with:
          tflint_version: v0.57.0
      - run: tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --chdir=environments/${{ matrix.target }} --config="$GITHUB_WORKSPACE/.tflint.hcl"
  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.18.4
      - run: helm lint helm/hybrid-demo --set azure.keyvaultName=a --set azure.workloadClientId=b --set azure.tenantId=c
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install checkov==3.4.3
      - run: checkov -d . --framework terraform --quiet --skip-download
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - run: docker build -t hybrid-demo:ci app
      - name: Block HIGH and CRITICAL image vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1 image --scanners vuln --exit-code 1 \
            --severity HIGH,CRITICAL hybrid-demo:ci
